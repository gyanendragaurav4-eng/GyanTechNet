kind = "web"
previewPath = "/"
title = "GyanTechNet"
version = "1.0.0"
id = "artifacts/gyantechnet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22157

[services.development]
run = "pnpm --filter @workspace/gyantechnet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gyantechnet", "run", "build" ]
publicDir = "artifacts/gyantechnet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22157"
BASE_PATH = "/"
